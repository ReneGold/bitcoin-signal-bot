name: Bitcoin V4 Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  risk-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Test-Branch laden
        uses: actions/checkout@v4
        with:
          ref: bitcoin-v4-test
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Abhaengigkeiten installieren
        run: python -m pip install -r requirements.txt
      - name: Bitcoin Risk Manager testen
        run: python -m unittest -v test_bitcoin_risk_manager.py
      - name: Bitcoin Time Machine testen
        run: python -m unittest -v test_bitcoin_time_machine.py
      - name: Bitcoin Entry Timer testen
        run: python -m unittest -v test_bitcoin_entry_timer.py
      - name: Bitcoin Exit Planner testen
        run: python -m unittest -v test_bitcoin_exit_planner.py
      - name: Bitcoin News und Volatilitaet testen
        run: python -m unittest -v test_bitcoin_news_volatility_filter.py
      - name: Bitcoin V4 Integration testen
        run: python -m unittest -v test_bitcoin_v4_research_pipeline.py
      - name: Bitcoin V4 Marktdaten Unit-Tests
        run: python -m unittest -v test_bitcoin_v4_market_diagnostic.py
      - name: Bitcoin V4 echte 15m und 5m Daten diagnostizieren
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python bitcoin_v4_market_diagnostic.py
      - name: BTC Marktdatenbericht exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-v4-market-diagnostic
          path: bitcoin_v4_market_diagnostic.json
          if-no-files-found: error
          retention-days: 14
      - name: Bitcoin historische Kursdaten Unit-Tests
        run: python -m unittest -v test_bitcoin_v4_historical_fetch.py
      - name: Bitcoin historische 15m und 1h Kursdaten laden
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python bitcoin_v4_historical_fetch.py
      - name: Bitcoin historische Daten als Test-Artefakt
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-v4-historical-candles
          path: bitcoin_v4_history/
          retention-days: 14
          if-no-files-found: error
      - name: Bitcoin V4 Score 60 65 70 Backtest
        run: python bitcoin_v4_score_backtest.py
      - name: Bitcoin V4 Backtest Ergebnisse exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-v4-score-comparison
          path: |
            bitcoin_v4_score_summary.csv
            bitcoin_v4_score_trades.csv
          retention-days: 14
          if-no-files-found: error
      - name: Bitcoin Score 60 Verlustanalyse
        run: python bitcoin_v4_loss_analysis.py
      - name: Bitcoin Verlustanalyse CSV exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-v4-loss-analysis
          path: |
            bitcoin_v4_loss_analysis_summary.csv
            bitcoin_v4_loss_analysis_trades.csv
          retention-days: 14
          if-no-files-found: error
      - name: Bitcoin 5m Bestaetigung Vergleich Unit-Tests
        run: python -m unittest -v test_bitcoin_v4_entry_confirmation_compare.py
      - name: Bitcoin 5m Bestaetigung historische Auswertung
        run: python bitcoin_v4_entry_confirmation_compare.py
      - name: Bitcoin 5m Vergleichsergebnisse exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-v4-5m-entry-comparison
          path: |
            bitcoin_v4_entry_confirm_trades.csv
            bitcoin_v4_entry_confirm_summary.json
          retention-days: 14
          if-no-files-found: error
      - name: Bitcoin Pullback Timer Unit-Tests
        run: python -m unittest -v test_bitcoin_v4_pullback_timer.py
      - name: Bitcoin Pullback vs Breakout Vergleich
        run: python bitcoin_v4_pullback_compare.py
      - name: Bitcoin Pullback Vergleich exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-v4-pullback-comparison
          path: |
            bitcoin_v4_pullback_trades.csv
            bitcoin_v4_pullback_summary.json
          retention-days: 14
          if-no-files-found: error
      - name: Bitcoin Marktphasenfilter Unit-Tests
        run: python -m unittest -v test_bitcoin_v4_market_phase_compare.py
      - name: Bitcoin 1h Trend und Marktstaerke vergleichen
        run: python bitcoin_v4_market_phase_compare.py
      - name: Bitcoin Marktphasenvergleich exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-v4-market-phase-comparison
          path: |
            bitcoin_v4_market_phase_summary.csv
            bitcoin_v4_market_phase_trades.csv
          retention-days: 14
          if-no-files-found: error
