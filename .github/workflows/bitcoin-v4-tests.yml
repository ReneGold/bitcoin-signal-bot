name: Bitcoin V4 Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  risk-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Test-Branch laden
        uses: actions/checkout@v4
        with:
          ref: bitcoin-v4-test
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bitcoin Risk Manager testen
        run: python -m unittest -v test_bitcoin_risk_manager.py
      - name: Bitcoin Time Machine testen
        run: python -m unittest -v test_bitcoin_time_machine.py
      - name: Bitcoin Entry Timer testen
        run: python -m unittest -v test_bitcoin_entry_timer.py
      - name: Bitcoin Exit Planner testen
        run: python -m unittest -v test_bitcoin_exit_planner.py
      - name: Bitcoin News und Volatilitaet testen
        run: python -m unittest -v test_bitcoin_news_volatility_filter.py
      - name: Bitcoin V4 Integration testen
        run: python -m unittest -v test_bitcoin_v4_research_pipeline.py
