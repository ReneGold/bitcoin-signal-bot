name: Bitcoin Signal Bot

"on":
  workflow_dispatch:
  schedule:
    - cron: "6,21,36,51 * * * *"

permissions:
  contents: write

concurrency:
  group: bitcoin-signal-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Bitcoin-Bot einmal ausführen
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_ACTIONS: "true"
        run: python bitcoin_signal_bot.py
      - name: Telegram Cloud-Test
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()

          r = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": "✅ BITCOIN DEMO V3.8 – Cloud-Test erfolgreich\nGitHub Actions → Telegram → Handy funktioniert."
              },
              timeout=20
          )

          r.raise_for_status()
          print("Bitcoin Telegram Cloud-Test: OK")
          PY
      - name: Bot-Zustand speichern
        run: |
          if [ -f bitcoin_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bitcoin_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update Bitcoin bot state [skip ci]"
              git push
            else
              echo "Keine Zustandsänderung."
            fi
          fi
